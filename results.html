<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1e8">
  <title>Poll results | Favorite Things</title>
  <link rel="stylesheet" href="styles.css"><script src="api-config.js" defer></script><script src="script.js" defer></script>
</head>
<body data-page="results">
  <main class="results-shell">
    <header class="results-header">
      <nav class="top-nav"><a href="index.html">← All polls</a></nav>
      <section class="uptime-panel" aria-labelledby="uptime-heading">
        <p class="eyebrow">The clock is ticking</p>
        <h2 id="uptime-heading">This site instance has been running for</h2>
        <output id="site-uptime" role="status" aria-live="polite">Checking uptime…</output>
      </section>
      <p class="eyebrow">Live tally</p>
      <h1>The people have spoken.</h1>
      <p class="lede">Results include votes submitted by all visitors.</p>
      <p id="results-message" role="status"></p>
    </header>

    <div class="results-layout">
      <section class="chart-grid" aria-label="Poll results">
        <article class="chart-card" data-result="meat">
          <div class="chart-heading"><span>01</span><h2>Favorite meat</h2></div>
          <div class="chart-stage"><div class="pie-chart" role="img"></div><output class="total-votes"></output></div>
        </article>
        <article class="chart-card" data-result="vegetables">
          <div class="chart-heading"><span>02</span><h2>Favorite vegetables</h2></div>
          <div class="chart-stage"><div class="pie-chart" role="img"></div><output class="total-votes"></output></div>
        </article>
        <article class="chart-card" data-result="desserts">
          <div class="chart-heading"><span>03</span><h2>Favorite desserts</h2></div>
          <div class="chart-stage"><div class="pie-chart" role="img"></div><output class="total-votes"></output></div>
        </article>
        <article class="chart-card" data-result="animals">
          <div class="chart-heading"><span>04</span><h2>Favorite animal</h2></div>
          <div class="chart-stage"><div class="pie-chart" role="img"></div><output class="total-votes"></output></div>
        </article>
      </section>

      <aside class="legend-panel">
        <p class="eyebrow">Color key</p>
        <h2>Know the slices.</h2>
        <div id="legend"></div>
        <button id="reload-page" type="button">Reload page <span aria-hidden="true">↻</span></button>
      </aside>
    </div>
  </main>
</body>
</html>
