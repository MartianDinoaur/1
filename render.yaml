services:
  - type: web
    name: favorite-things-poll
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/stats
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: POLL_DATA_FILE
        value: /var/data/poll-data.json
      - key: POLL_GITHUB_REPOSITORY
        value: TheNamelessEvilNamedNag/1
      - key: POLL_GITHUB_BRANCH
        value: main
      - key: POLL_GITHUB_DATA_PATH
        value: poll-data.json
      - key: POLL_ALLOWED_ORIGINS
        value: https://thenamelessevilnamednag.github.io
      - key: POLL_REQUIRE_GITHUB_STORAGE
        value: "true"
      - key: POLL_GITHUB_TOKEN
        sync: false
    disk:
      name: poll-data
      mountPath: /var/data
      sizeGB: 1
