name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Check poll API URL
        run: |
          if ! grep -Eq '^window\.POLL_API_BASE_URL = "https://[^"/]+";$' api-config.js; then
            echo "::error::Set the HTTPS API origin in api-config.js before deploying the Pages site."
            exit 1
          fi
      - name: Prepare site files
        run: |
          mkdir -p _site
          cp index.html meat.html vegetables.html desserts.html animals.html results.html styles.css api-config.js script.js _site/
      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
