services:
  - type: web
    name: martiandinoaur-favorite-poll
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/uptime
    envVars:
      - key: POLL_GITHUB_TOKEN
        sync: false
      - key: POLL_GITHUB_REPOSITORY
        value: MartianDinoaur/1
      - key: POLL_GITHUB_BRANCH
        value: main
      - key: POLL_GITHUB_DATA_PATH
        value: poll-data.json
      - key: POLL_REQUIRE_GITHUB_STORAGE
        value: "false"
      - key: POLL_DATA_FILE
        value: /tmp/poll-data.json
      - key: POLL_ALLOWED_ORIGINS
        value: https://martiandinoaur.github.io
