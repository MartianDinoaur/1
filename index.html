<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1e8">
  <title>Favorite Things Poll</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body data-page="home">
  <main class="home-shell">
    <header class="home-header">
      <p class="eyebrow">The weekly favorite</p>
      <h1>Pick your favorites.</h1>
      <p class="lede">Four quick polls. Your votes stay saved in this browser.</p>
    </header>

    <nav class="poll-grid" aria-label="Poll pages">
      <a class="poll-card meat" href="meat.html">
        <span class="card-number">01</span>
        <span class="card-title">Favorite meat</span>
        <span class="card-arrow" aria-hidden="true">→</span>
      </a>
      <a class="poll-card vegetables" href="vegetables.html">
        <span class="card-number">02</span>
        <span class="card-title">Favorite vegetables</span>
        <span class="card-arrow" aria-hidden="true">→</span>
      </a>
      <a class="poll-card desserts" href="desserts.html">
        <span class="card-number">03</span>
        <span class="card-title">Favorite desserts</span>
        <span class="card-arrow" aria-hidden="true">→</span>
      </a>
      <a class="poll-card animals" href="animals.html">
        <span class="card-number">04</span>
        <span class="card-title">Favorite animal</span>
        <span class="card-arrow" aria-hidden="true">→</span>
      </a>
    </nav>

    <a class="results-link" href="results.html">See all poll results <span aria-hidden="true">↗</span></a>
  </main>
</body>
</html>
